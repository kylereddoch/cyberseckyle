
<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
  
  
  
    
  

  <rect id="bg" width="100%" height="100%" opacity="1" fill="#cba6f7" />

  <!-- date -->
  <text
    font-family="&#39;Atkinson Hyperlegible&#39;, Ubuntu, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#1e1e2e"
    letter-spacing="-1"
  >
    <tspan x="160" y="50">
      11 / 25 / 2025
    </tspan>
  </text>

  <!-- title -->
  <text
    id="text"
    font-family="&#39;Red Hat Display&#39;, Ubuntu, sans-serif"
    font-size="80"
    font-weight="900"
    fill="#1e1e2e"
    letter-spacing="-3"
  >
    
      <tspan x="160" y="150"> The Genesis Mission </tspan>
    
      <tspan x="160" y="235"> Puts AI in Charge of </tspan>
    
      <tspan x="160" y="320"> Our Science. As a </tspan>
    
      <tspan x="160" y="405"> Security Pro, I’m Not </tspan>
    
      <tspan x="160" y="490"> Sold. </tspan>
    
  </text>

  <!-- url -->
  <text
    font-family="&#39;Atkinson Hyperlegible&#39;, Ubuntu, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#1e1e2e"
    letter-spacing="-0.5"
  >
    <tspan x="160" y="580">kylereddoch.me</tspan>
  </text>


  <!-- sitename -->
  <text
    font-family="&#39;Red Hat Display&#39;, Ubuntu, sans-serif"
