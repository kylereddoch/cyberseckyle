<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How an Enzo Reader catch-up request works</title>
  <desc id="desc">Feedbin holds the chosen feeds and reading state. Enzo Reader synchronizes and retrieves articles. ChatGPT turns the retrieved material into a short digest with links. The reader opens original articles to verify important details.</desc>
  <rect width="1200" height="420" rx="24" fill="#1e1b2e"/>
  <text x="48" y="67" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="31" font-weight="700">“What did I miss?”</text>
  <text x="48" y="101" fill="#bac2de" font-family="Arial, sans-serif" font-size="18">A quick summary starts with the feeds I already chose.</text>

  <rect x="48" y="132" width="325" height="177" rx="18" fill="#313244" stroke="#6c7086" stroke-width="2"/>
  <circle cx="82" cy="169" r="18" fill="#89b4fa"/>
  <text x="82" y="176" text-anchor="middle" fill="#1e1b2e" font-family="Arial, sans-serif" font-size="19" font-weight="700">1</text>
  <text x="113" y="177" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">Feedbin</text>
  <text x="73" y="222" fill="#e0dce8" font-family="Arial, sans-serif" font-size="19">Chosen subscriptions</text>
  <text x="73" y="255" fill="#e0dce8" font-family="Arial, sans-serif" font-size="19">and reading state</text>

  <path d="M392 220h34m-10-10 10 10-10 10" fill="none" stroke="#cba6f7" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

  <rect x="445" y="132" width="325" height="177" rx="18" fill="#313244" stroke="#6c7086" stroke-width="2"/>
  <circle cx="479" cy="169" r="18" fill="#cba6f7"/>
  <text x="479" y="176" text-anchor="middle" fill="#1e1b2e" font-family="Arial, sans-serif" font-size="19" font-weight="700">2</text>
  <text x="510" y="177" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">Enzo Reader</text>
  <text x="470" y="222" fill="#e0dce8" font-family="Arial, sans-serif" font-size="19">Synchronizes articles</text>
  <text x="470" y="255" fill="#e0dce8" font-family="Arial, sans-serif" font-size="19">and retrieves results</text>

  <path d="M789 220h34m-10-10 10 10-10 10" fill="none" stroke="#cba6f7" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

  <rect x="842" y="132" width="310" height="177" rx="18" fill="#313244" stroke="#6c7086" stroke-width="2"/>
  <circle cx="876" cy="169" r="18" fill="#a6e3a1"/>
  <text x="876" y="176" text-anchor="middle" fill="#1e1b2e" font-family="Arial, sans-serif" font-size="19" font-weight="700">3</text>
  <text x="907" y="177" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">ChatGPT</text>
  <text x="867" y="222" fill="#e0dce8" font-family="Arial, sans-serif" font-size="19">Short digest</text>
  <text x="867" y="255" fill="#e0dce8" font-family="Arial, sans-serif" font-size="19">with article links</text>

  <rect x="48" y="335" width="1104" height="52" rx="12" fill="#45475a"/>
  <text x="600" y="368" text-anchor="middle" fill="#f5f2fa" font-family="Arial, sans-serif" font-size="19">Open the original article to check the details that matter.</text>
</svg>
