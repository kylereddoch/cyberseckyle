name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Quick Note"]
    types: [completed]
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Persist npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Persist Eleventy .cache
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-eleventy-fetch-cache

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          deploy_dir="$(mktemp -d)"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add --detach "${deploy_dir}" origin/gh-pages
          else
            git worktree add --detach "${deploy_dir}"
            git -C "${deploy_dir}" checkout --orphan gh-pages
          fi

          find "${deploy_dir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. "${deploy_dir}/"
          touch "${deploy_dir}/.nojekyll"
          printf '%s\n' 'www.kylereddoch.me' > "${deploy_dir}/CNAME"

          git -C "${deploy_dir}" add --all

          if git -C "${deploy_dir}" diff --cached --quiet; then
            echo "No deploy changes."
          else
            git -C "${deploy_dir}" commit -m "Deploy ${GITHUB_SHA}"
            git -C "${deploy_dir}" push origin HEAD:gh-pages --force
          fi

      - name: Notify Bridgy Fed
        if: github.ref == 'refs/heads/main'
        run: >-
          curl -fsS -X POST https://fed.brid.gy/web-site
          -H 'Content-Type: application/x-www-form-urlencoded'
          --data 'url=https://www.kylereddoch.me/'
