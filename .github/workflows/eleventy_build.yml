name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort, so use fallback windows in case a run
    # is delayed or dropped. These are 10:15, 10:45, and 11:15 a.m. Central
    # during daylight saving time.
    - cron: "15 15 * * *"
    - cron: "45 15 * * *"
    - cron: "15 16 * * *"
  workflow_run:
    workflows: ["Publish Quick Note"]
    types: [completed]
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Persist npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Persist Eleventy .cache
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-eleventy-fetch-cache

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHING_API_URL: ${{ vars.WATCHING_API_URL }}
          NEWSLETTER_API_URL: ${{ vars.NEWSLETTER_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        run: bash scripts/deploy-gh-pages.sh "Deploy ${GITHUB_SHA}"

      - name: Post eligible articles to Mastodon
        id: post_mastodon
        if: github.ref == 'refs/heads/main'
        run: node scripts/post-to-mastodon.mjs
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_SITE_URL: https://www.kylereddoch.me
          MASTODON_LANGUAGE: en
          MASTODON_VISIBILITY: public
          MASTODON_WAIT_FOR_PUBLIC_URL: true
          MASTODON_WAIT_TIMEOUT_SECONDS: 900
          MASTODON_WAIT_INTERVAL_SECONDS: 15
          MASTODON_POST_MAX_ATTEMPTS: 3
          MASTODON_POST_RETRY_DELAY_SECONDS: 10

      - name: Post eligible articles to X
        id: post_x
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ "${X_AUTO_POST_ENABLED}" != "true" ]]; then
            echo "X auto-posting is disabled. Connect X in Buffer, add BUFFER_API_KEY, then set X_AUTO_POST_ENABLED to true."
            echo "posted_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/post-to-x.mjs
        env:
          X_AUTO_POST_ENABLED: ${{ vars.X_AUTO_POST_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_X_CHANNEL_NAME: ${{ vars.BUFFER_X_CHANNEL_NAME }}
          X_SITE_URL: https://www.kylereddoch.me
          X_WAIT_FOR_PUBLIC_URL: true
          X_WAIT_TIMEOUT_SECONDS: 900
          X_WAIT_INTERVAL_SECONDS: 15
          BUFFER_WAIT_TIMEOUT_SECONDS: 120
          BUFFER_WAIT_INTERVAL_SECONDS: 5

      - name: Commit social post URLs
        id: commit_social
        if: ${{ (steps.post_mastodon.outputs.posted_count != '' && steps.post_mastodon.outputs.posted_count != '0') || (steps.post_x.outputs.posted_count != '' && steps.post_x.outputs.posted_count != '0') || (steps.post_x.outputs.failed_count != '' && steps.post_x.outputs.failed_count != '0') }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/posts src/notes src/now

          if git diff --cached --quiet; then
            echo "committed=false" >> "${GITHUB_OUTPUT}"
          else
            git commit -m "Add social URLs for published posts"
            git push
            echo "committed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rebuild site with social post URLs
        if: ${{ steps.commit_social.outputs.committed == 'true' }}
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHING_API_URL: ${{ vars.WATCHING_API_URL }}
          NEWSLETTER_API_URL: ${{ vars.NEWSLETTER_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy site with social post URLs
        if: ${{ steps.commit_social.outputs.committed == 'true' }}
        run: bash scripts/deploy-gh-pages.sh "Deploy social post URLs $(git rev-parse HEAD)"

      - name: Notify Bridgy Fed
        if: github.ref == 'refs/heads/main'
        run: |
          set +e

          curl --fail --show-error --silent --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST https://fed.brid.gy/web-site \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'url=https://www.kylereddoch.me/'
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "::warning::Bridgy Fed notification failed with curl exit code ${status}. The site deploy already completed, so this workflow will continue."
          fi
