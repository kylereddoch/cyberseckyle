name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Every two hours from 7 a.m. through 9 p.m., plus a final 10 p.m. build.
    # Fixed CST (UTC-6): 7, 9, 11 a.m.; 1, 3, 5, 7, 9, 10 p.m.
    # GitHub cron uses UTC and is best-effort; it may run later than scheduled.
    - cron: "0 1,3,4,13,15,17,19,21,23 * * *"
  workflow_run:
    workflows: ["Publish Quick Note"]
    types: [completed]
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          # Resolve main after this job acquires the concurrency slot. An event
          # SHA can predate the previous run's saved social URLs and Buffer IDs.
          # Keep the default event checkout for PRs and other branches.
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Persist npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Persist Eleventy .cache
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-eleventy-fetch-cache

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHING_API_URL: ${{ vars.WATCHING_API_URL }}
          NEWSLETTER_API_URL: ${{ vars.NEWSLETTER_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        run: bash scripts/deploy-gh-pages.sh "Deploy $(git rev-parse HEAD)"

      - name: Verify previous social results are restored
        id: social_recovery
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-social-recovery.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post eligible articles to Mastodon
        id: post_mastodon
        if: github.ref == 'refs/heads/main'
        run: node scripts/post-to-mastodon.mjs
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_SITE_URL: https://www.kylereddoch.me
          MASTODON_LANGUAGE: en
          MASTODON_VISIBILITY: public
          MASTODON_WAIT_FOR_PUBLIC_URL: true
          MASTODON_WAIT_TIMEOUT_SECONDS: 900
          MASTODON_WAIT_INTERVAL_SECONDS: 15
          MASTODON_POST_MAX_ATTEMPTS: 3
          MASTODON_POST_RETRY_DELAY_SECONDS: 10

      - name: Post eligible articles to X
        id: post_x
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ "${X_AUTO_POST_ENABLED}" != "true" ]]; then
            echo "X auto-posting is disabled. Connect X in Buffer, add BUFFER_API_KEY, then set X_AUTO_POST_ENABLED to true."
            echo "posted_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/post-to-buffer.mjs --platform=x
        env:
          X_AUTO_POST_ENABLED: ${{ vars.X_AUTO_POST_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_X_CHANNEL_NAME: ${{ vars.BUFFER_X_CHANNEL_NAME }}
          X_SITE_URL: https://www.kylereddoch.me
          X_WAIT_FOR_PUBLIC_URL: true
          X_WAIT_TIMEOUT_SECONDS: 900
          X_WAIT_INTERVAL_SECONDS: 15
          BUFFER_WAIT_TIMEOUT_SECONDS: 120
          BUFFER_WAIT_INTERVAL_SECONDS: 5

      - name: Post eligible articles to LinkedIn
        id: post_linkedin
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ "${LINKEDIN_AUTO_POST_ENABLED}" != "true" ]]; then
            echo "LinkedIn auto-posting is disabled. Connect LinkedIn in Buffer, add BUFFER_API_KEY, then set LINKEDIN_AUTO_POST_ENABLED to true."
            echo "posted_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/post-to-buffer.mjs --platform=linkedin
        env:
          LINKEDIN_AUTO_POST_ENABLED: ${{ vars.LINKEDIN_AUTO_POST_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ vars.BUFFER_LINKEDIN_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_NAME: ${{ vars.BUFFER_LINKEDIN_CHANNEL_NAME }}
          LINKEDIN_SITE_URL: https://www.kylereddoch.me
          LINKEDIN_WAIT_FOR_PUBLIC_URL: true
          LINKEDIN_WAIT_TIMEOUT_SECONDS: 900
          LINKEDIN_WAIT_INTERVAL_SECONDS: 15
          BUFFER_WAIT_TIMEOUT_SECONDS: 120
          BUFFER_WAIT_INTERVAL_SECONDS: 5

      - name: Post eligible articles to Facebook Page
        id: post_facebook
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ "${FACEBOOK_AUTO_POST_ENABLED}" != "true" ]]; then
            echo "Facebook auto-posting is disabled. Connect the Page in Buffer, then set FACEBOOK_AUTO_POST_ENABLED to true."
            echo "posted_count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/post-to-buffer.mjs --platform=facebook
        env:
          FACEBOOK_AUTO_POST_ENABLED: ${{ vars.FACEBOOK_AUTO_POST_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_NAME: ${{ vars.BUFFER_FACEBOOK_CHANNEL_NAME }}
          FACEBOOK_SITE_URL: https://www.kylereddoch.me
          FACEBOOK_WAIT_FOR_PUBLIC_URL: true
          FACEBOOK_WAIT_TIMEOUT_SECONDS: 900
          FACEBOOK_WAIT_INTERVAL_SECONDS: 15
          BUFFER_WAIT_TIMEOUT_SECONDS: 120
          BUFFER_WAIT_INTERVAL_SECONDS: 5

      - name: Commit social post URLs
        id: commit_social
        # Save accepted post IDs even if a later publishing step fails before
        # emitting its counts. An unchanged tree is handled below.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.post_mastodon.outcome != '' && steps.post_mastodon.outcome != 'skipped' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/posts src/notes src/now

          if git diff --cached --quiet; then
            echo "committed=false" >> "${GITHUB_OUTPUT}"
          else
            # Keep a recovery copy if a conflicting edit or push failure prevents
            # persistence. Retrying below only pushes Git data; it never reposts.
            git diff --cached --binary > "${RUNNER_TEMP}/social-post-state.patch"
            git commit -m "Add social URLs for published posts [skip ci]"
            retry_delays=(15 30 60 120)
            for attempt in 1 2 3 4 5; do
              if git fetch origin main; then
                if ! git rebase origin/main; then
                  echo "::error::Social metadata conflicts with newer content. Recover the saved patch without overwriting the remote changes."
                  exit 1
                fi
                if git push origin HEAD:main > "${RUNNER_TEMP}/social-state-push.log" 2>&1; then
                  cat "${RUNNER_TEMP}/social-state-push.log"
                  echo "committed=true" >> "${GITHUB_OUTPUT}"
                  exit 0
                fi
                cat "${RUNNER_TEMP}/social-state-push.log"
                if grep -Eqi 'GH006|GH013|protected branch|repository rule violations|permission .* denied|authentication failed' "${RUNNER_TEMP}/social-state-push.log"; then
                  echo "::error::GitHub refused the metadata push due to permissions or branch rules. No protection will be bypassed."
                  exit 1
                fi
              fi
              echo "Social metadata save attempt ${attempt} failed."
              if (( attempt < 5 )); then
                delay="${retry_delays[$((attempt - 1))]}"
                echo "Retrying Git persistence in ${delay}s; social publishers will not be rerun."
                sleep "${delay}"
              fi
            done
            echo "::error::Social post results could not be saved. Recover the social-post-state artifact before rerunning publishing."
            exit 1
          fi

      - name: Preserve social post results on save failure
        if: ${{ failure() && steps.commit_social.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: social-post-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/social-post-state.patch
          if-no-files-found: ignore
          retention-days: 30

      - name: Rebuild site with social post URLs
        if: ${{ steps.commit_social.outputs.committed == 'true' }}
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          TRAKT_REFRESH_TOKEN: ${{ secrets.TRAKT_REFRESH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WATCHING_API_URL: ${{ vars.WATCHING_API_URL }}
          NEWSLETTER_API_URL: ${{ vars.NEWSLETTER_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy site with social post URLs
        if: ${{ steps.commit_social.outputs.committed == 'true' }}
        run: bash scripts/deploy-gh-pages.sh "Deploy social post URLs $(git rev-parse HEAD)"

      - name: Notify Bridgy Fed
        if: github.ref == 'refs/heads/main'
        run: |
          set +e

          curl --fail --show-error --silent --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST https://fed.brid.gy/web-site \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'url=https://www.kylereddoch.me/'
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "::warning::Bridgy Fed notification failed with curl exit code ${status}. The site deploy already completed, so this workflow will continue."
          fi
