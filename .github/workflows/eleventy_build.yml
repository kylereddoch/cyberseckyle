name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Quick Note"]
    types: [completed]
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Persist npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Persist Eleventy .cache
        uses: actions/cache@v5
        with:
          path: ./.cache
          key: ${{ runner.os }}-eleventy-fetch-cache

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        run: bash scripts/deploy-gh-pages.sh "Deploy ${GITHUB_SHA}"

      - name: Post eligible articles to Mastodon
        id: post_mastodon
        if: github.ref == 'refs/heads/main'
        run: node scripts/post-to-mastodon.mjs
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_SITE_URL: https://www.kylereddoch.me
          MASTODON_LANGUAGE: en
          MASTODON_VISIBILITY: public
          MASTODON_WAIT_FOR_PUBLIC_URL: true
          MASTODON_WAIT_TIMEOUT_SECONDS: 360
          MASTODON_WAIT_INTERVAL_SECONDS: 10
          MASTODON_POST_MAX_ATTEMPTS: 3
          MASTODON_POST_RETRY_DELAY_SECONDS: 10

      - name: Commit Mastodon URLs
        id: commit_mastodon
        if: ${{ steps.post_mastodon.outputs.posted_count != '' && steps.post_mastodon.outputs.posted_count != '0' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/posts src/notes

          if git diff --cached --quiet; then
            echo "committed=false" >> "${GITHUB_OUTPUT}"
          else
            git commit -m "Add Mastodon URLs for published posts"
            git push
            echo "committed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Rebuild site with Mastodon URLs
        if: ${{ steps.commit_mastodon.outputs.committed == 'true' }}
        run: npm run build-ghpages
        env:
          TZ: America/Chicago
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Deploy site with Mastodon URLs
        if: ${{ steps.commit_mastodon.outputs.committed == 'true' }}
        run: bash scripts/deploy-gh-pages.sh "Deploy Mastodon URLs $(git rev-parse HEAD)"

      - name: Notify Bridgy Fed
        if: github.ref == 'refs/heads/main'
        run: |
          set +e

          curl --fail --show-error --silent --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST https://fed.brid.gy/web-site \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'url=https://www.kylereddoch.me/'
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "::warning::Bridgy Fed notification failed with curl exit code ${status}. The site deploy already completed, so this workflow will continue."
          fi
